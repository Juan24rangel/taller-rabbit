      RABBIT_HOST: ${RABBIT_HOST}

  prod-envios:
    build: ../../productores/envios-python
    restart: on-failure
    environment:
      RABBIT_HOST: ${RABBIT_HOST}

  cons-bodega:
    build: ../../consumidores/bodega-go
